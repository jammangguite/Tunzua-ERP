<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4D3E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tunzua" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      window.__tunzuaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__tunzuaDeferredPrompt = e;
        window.dispatchEvent(new Event('tunzua-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__tunzuaDeferredPrompt = null;
        window.dispatchEvent(new Event('tunzua-pwa-installed'));
      });
    </script>
    <title>Tunzua — Simple Accounting Ledger</title>
    <meta
      name="description"
      content="Tunzua is a calm, warm-paper double-entry accounting ledger for tracking sales, purchases, receipts, payments, recurring bills, fixed assets, and financial statements."
    />
    <meta property="og:title" content="Tunzua — Simple Accounting Ledger" />
    <meta
      property="og:description"
      content="Clean, warm-paper double-entry accounting ledger with recurring bill reminders, date-range filtering, and fixed asset depreciation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
